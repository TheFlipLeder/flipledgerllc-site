<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Your Password — The Flip Ledger LLC</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #0a0a0f;
    --card: #14141c;
    --border: #26262f;
    --text: #f4f4f6;
    --muted: #9a9aa6;
    --accent: #5b8cff;
    --accent-hover: #4674f0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 16px;
  }
  .card {
    width: 100%;
    max-width: 400px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px 28px;
  }
  .logo {
    font-size: 13px;
    letter-spacing: 0.08em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 24px;
  }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p.sub { color: var(--muted); font-size: 14px; margin: 0 0 24px; line-height: 1.5; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  input[type="password"] {
    width: 100%;
    padding: 12px 14px;
    background: #1c1c26;
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 15px;
    margin-bottom: 16px;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    width: 100%;
    padding: 12px 14px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .message {
    margin-top: 16px;
    font-size: 14px;
    line-height: 1.5;
    padding: 12px 14px;
    border-radius: 10px;
    display: none;
  }
  .message.error {
    display: block;
    background: rgba(255, 91, 91, 0.12);
    color: #ff9d9d;
    border: 1px solid rgba(255, 91, 91, 0.3);
  }
  .skip-link { text-align: center; margin-top: 20px; font-size: 13px; }
  .skip-link a { color: var(--muted); cursor: pointer; text-decoration: none; }
  .skip-link a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="card">
  <div class="logo">The Flip Ledger LLC</div>
  <h1>Create a password</h1>
  <p class="sub">You're in. Set a password now so you can log in with just your email and password next time, instead of waiting on an email link.</p>

  <form id="set-password-form">
    <label for="password">New password</label>
    <input type="password" id="password" placeholder="At least 8 characters" minlength="8" required>
    <label for="confirm">Confirm password</label>
    <input type="password" id="confirm" placeholder="Type it again" minlength="8" required>
    <button type="submit" id="submit-btn">Save password &amp; continue</button>
  </form>

  <div id="message" class="message"></div>

  <div class="skip-link"><a id="skip">Skip for now — keep using email links</a></div>
</div>

<script src="supabase-client.js"></script>
<script>
  const messageEl = document.getElementById("message");

  (async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) {
      // No active session — send them to log in first.
      window.location.href = "login.html";
    }
  })();

  document.getElementById("set-password-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const password = document.getElementById("password").value;
    const confirm = document.getElementById("confirm").value;
    const submitBtn = document.getElementById("submit-btn");

    messageEl.className = "message";

    if (password !== confirm) {
      messageEl.className = "message error";
      messageEl.textContent = "Those passwords don't match — try again.";
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Saving...";

    // Set the password AND mark this account as having one, so dashboard.html
    // stops redirecting here on future logins.
    const { error } = await supabaseClient.auth.updateUser({
      password: password,
      data: { has_password: true }
    });

    submitBtn.disabled = false;
    submitBtn.textContent = "Save password & continue";

    if (error) {
      messageEl.className = "message error";
      messageEl.textContent = "Couldn't save that password: " + error.message;
    } else {
      window.location.href = "dashboard.html";
    }
  });

  document.getElementById("skip").addEventListener("click", () => {
    window.location.href = "dashboard.html";
  });
</script>

</body>
</html>
