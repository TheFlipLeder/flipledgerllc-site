<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Project — The Flip Ledger LLC</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #0a0a0f;
    --card: #14141c;
    --border: #26262f;
    --text: #f4f4f6;
    --muted: #9a9aa6;
    --accent: #5b8cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 40px 16px;
  }
  .wrap { max-width: 480px; margin: 0 auto; text-align: center; }
  .logo {
    font-size: 13px;
    letter-spacing: 0.08em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 24px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px 28px;
  }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: var(--muted); font-size: 14px; line-height: 1.5; }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">The Flip Ledger LLC</div>
  <div class="card" id="status-card">
    <h1>Checking your login…</h1>
    <p>One moment.</p>
  </div>
</div>

<script src="supabase-client.js"></script>
<script>
  // This is a placeholder confirmation page for now — the real project
  // dashboard (status, uploads, messages, payment) gets built in the next step.
  (async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    const card = document.getElementById("status-card");

    if (session) {
      // First-time client (came in via magic link, hasn't set a password yet)?
      // Send them to set one before showing the dashboard.
      if (!session.user.user_metadata || !session.user.user_metadata.has_password) {
        window.location.href = "set-password.html";
        return;
      }

      card.innerHTML = `
        <h1>You're logged in</h1>
        <p>Signed in as ${session.user.email}</p>
        <p>Your full project dashboard is coming here next.</p>
      `;
    } else {
      card.innerHTML = `
        <h1>Not logged in</h1>
        <p>That link may have expired. <a href="login.html" style="color:#5b8cff;">Request a new login link</a>.</p>
      `;
    }
  })();
</script>
</body>
</html>
